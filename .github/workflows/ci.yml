# Continuous integration: every push to main and every pull request runs the
# same checks as the pre-commit hooks, on clean machines.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false # finish every OS, even if one fails
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install the project and its locked dependencies
        run: uv sync --locked

      - name: Formatting
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Types
        run: uv run mypy src

      - name: Tests
        run: uv run pytest
